[package]
name = "autumn-plugin-carousel"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
description = "An accessible carousel widget pack for Autumn"
repository = "https://github.com/autumn-foundation/autumn-plugin-carousel"
readme = "README.md"
keywords = ["autumn", "carousel", "widget", "accessibility", "htmx"]
categories = ["web-programming", "accessibility"]
include = ["/src/**", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
autumn-web = { version = "0.10", default-features = false, features = ["maud"] }
maud = "0.27"
thiserror = "2"

[dev-dependencies]
proptest = "1"
scraper = "0.29"
serde = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
# The browser tests. They need Chromium.
system-tests = ["autumn-web/system-tests", "autumn-web/htmx"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
