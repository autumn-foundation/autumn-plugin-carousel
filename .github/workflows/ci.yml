name: CI

# Format, lint, test, browser test and coverage for the carousel pack.
# All jobs use Rust 1.97.0, the MSRV. A pinned toolchain keeps new lints
# from breaking CI. Change the version in all jobs at one time.

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, for new Chromium and crate releases.
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  style:
    name: Docs style (ASD-STE100 sentence length)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          python3 -I scripts/check-ste-length.py README.md CHANGELOG.md CLAUDE.md
          docs/*.md docs/adr/*.md src/*.rs src/carousel.js src/carousel.css
          tests/*.rs tests/common/mod.rs

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Chromium
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      # A filter that matches nothing exits 0, so check the pass count.
      - name: Run the browser tests
        env:
          AUTUMN_CHROMIUM: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          cargo test --locked --features system-tests --test browser -- --ignored --test-threads=1 \
            | tee "${RUNNER_TEMP}/browser.log"
          grep -qE 'test result: ok\. [1-9][0-9]* passed' "${RUNNER_TEMP}/browser.log" \
            || { echo "::error::no browser tests ran"; exit 1; }
      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-tests
          path: target/system-tests/
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Line coverage of the Rust code, 90% or more
        run: cargo llvm-cov --locked --fail-under-lines 90 --ignore-filename-regex 'tests/'
